# Packaged standalone defaults. Docker environment variables (for example
# SIMULINK_MODELS_DIRECTORY) override these values. Do not add credentials here.

# Location of the folder containing Simulink models. The path must not point to
# the MATLAB scripts folder. Example: /data/simulink-models/
simulinkModelsDirectory = simulinkmodels/

# Location of MATLAB scripts for the opt-in MATLAB backend. Example:
# /opt/simulink-adapter/matlab/
matlabScriptsDirectory = matlab/

# Optional Simulink Ecore file for the legacy regeneration path. Leave empty
# for normal standalone/WAR operation. Example:
# /opt/simulink-adapter/simulink.ecore
simulinkEcoreLocation =

# OSLC Simulink adapter service port. Example: 8080
portNumber = 8080

# Synchronize models with an SVN repository (true or false).
syncWithSvnRepo = false

# When synchronization is enabled, use a file, svn, or http(s) URL with no
# trailing slash. Example: https://svn.example.test/repository/project
svnurl =

# Refresh interval in seconds; this must be an integer. Example: 300
delayInSecondsBetweenDataRefresh = 100000

# Consider individual files selected by their SVN URLs (true or false).
useIndividualSubversionFiles = false

# Credentials are deliberately not packaged. Configure them with Docker
# environment variables or an external config file instead:
# svnUserName = example-user
# svnPassword = supplied-outside-source-control
